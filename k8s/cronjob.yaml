apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup
  namespace: todolist
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: todolist-app
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: todolist-app:local
              imagePullPolicy: IfNotPresent
              env:
                - name: CLEANUP_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: todolist-secrets
                      key: CLEANUP_TOKEN
              command:
                - python
                - -c
                - |
                  import requests, os
                  token = os.environ['CLEANUP_TOKEN']
                  r = requests.post(
                      "http://todolist-app.todolist.svc:80/cleanup",
                      headers={"X-Cleanup-Token": token},
                      timeout=10,
                  )
                  print(r.text)
                  r.raise_for_status()