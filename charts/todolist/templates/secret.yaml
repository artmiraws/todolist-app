{{- if and .Values.secrets.create .Values.externalSecret.enabled -}}
{{- fail "secrets.create and externalSecret.enabled are mutually exclusive: choose a local Secret or the External Secrets Operator" -}}
{{- end -}}
{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todolist.secretName" . }}
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
