# Example overrides for the AWS dev environment. Copy to values-dev.yaml (gitignored) and fill in
# the values produced by the infrastructure, or let CI inject them from the Terraform outputs.
# Nothing here is committed with real account data.

image:
  repository: "<account-id>.dkr.ecr.us-east-1.amazonaws.com/todolist"
  digest: "sha256:<image-digest>"

# Cloud uses Aurora and the External Secrets Operator, not the in-cluster PostgreSQL/Secret.
postgresql:
  enabled: false

secrets:
  create: false

externalSecret:
  enabled: true
  dbSecretArn: "arn:aws:secretsmanager:us-east-1:<account-id>:secret:<rds-managed-secret>"
  appSecretArn: "arn:aws:secretsmanager:us-east-1:<account-id>:secret:todolist-dev/app"

config:
  dbHost: "<aurora-writer-endpoint>"
  dbName: "todolist"

ingress:
  host: "dev.todolist.<base-domain>"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:<account-id>:certificate/<id>"
