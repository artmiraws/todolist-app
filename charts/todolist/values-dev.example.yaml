# Example overrides for the AWS dev environment. Copy to values-dev.yaml (not committed)
# and fill in the values produced by the infrastructure (see infra/environments/dev outputs).

image:
  repository: "<account-id>.dkr.ecr.us-east-1.amazonaws.com/todolist"
  digest: "sha256:<image-digest>"

config:
  dbHost: "<aurora-writer-endpoint>"
  dbName: "todolist"

externalSecret:
  dbSecretArn: "arn:aws:secretsmanager:us-east-1:<account-id>:secret:<rds-managed-secret>"
  appSecretArn: "arn:aws:secretsmanager:us-east-1:<account-id>:secret:todolist-dev/app"

ingress:
  host: "dev.todolist.<base-domain>"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:<account-id>:certificate/<id>"
