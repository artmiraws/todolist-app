system: TODO List
description: DevOps challenge for a Flask/PostgreSQL TODO List application.
context:
  timebox: One week; R0-R5 take priority over optional environments and tools.
  environments: Local k3s in k3d and one cost-conscious AWS EKS cluster named dev.
  delivery: GitHub Actions builds from source and deploys dev; no local-to-dev promotion.
  infrastructure: OpenTofu; confirm repository placement before implementation.
  requirements:
    R0: Run locally on Kubernetes with a multi-stage Dockerfile.
    R1: Provision the cloud cluster and dependencies as code.
    R2: Automate application deployment.
    R3: Access the application through a browser.
    R4: Demonstrate scalability and resilience, documenting dev limitations.
    R5: Provide setup, operational documentation, and decision records.
  execution:
    - Entries are YAML documents with stable IDs, inputs, outputs, and statuses.
    - Work on open tasks only when their dependencies are done.
    - Deferred tasks require explicit scope approval; do not execute them automatically.
    - Statuses are open, in_progress, blocked, done, and deferred.
    - Mark done only after verification; record evidence and unresolved blockers.
    - Confirm AWS account, region, budget, and destructive actions before execution.
    - Do not commit or push unless explicitly requested.
task: Create and maintain the delivery plan, decisions, and requirement-aligned epics.
verification:
  - Initial plan delivered and aligned with one EKS dev and optional prod/staging.
