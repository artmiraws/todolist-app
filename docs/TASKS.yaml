id: GITOPS-HUB
epic: EPIC-10
requirements: [R1, R2, R4]
in: [PLAN.md, platform/, todolist-app/]
out: [platform/, todolist-app/]
status: open
priority: P1
next: true
path: .
ignore-paths: []
depends-on: [GITOPS, PROD-PROMOTION]
task:
  - Run a single Argo CD that manages every environment (one view), instead of one Argo CD per cluster; it lives in the prod cluster (no hub cluster for now).
  - Stop embedding the application name in cluster names; a cluster is platform infrastructure that hosts many services, not one app (for example platform-dev / platform-prod).
  - Move the shared artifact registry (ECR) out of the environment roots and into the platform, so an environment's lifecycle cannot delete another environment's dependency.
  - Separate concerns: the platform repo owns the clusters, add-ons, Argo CD, and the published contract; the app repo owns an ApplicationSet that generates its per-environment Applications.
  - Keep apps decoupled from platform internals; they consume the published contract (SSM parameters) rather than Terraform internals.
  - Deliver the contract at render time with a config-management plugin (CMP) that reads SSM, so the platform stays application-agnostic (ADR-015); Terraform-injected Application values are only the interim.
  - Adopt trunk-based delivery: one branch (main), per-environment config in envs/<env>/, and promotion through a pull request (no environment branches).
  - Version the chart as an OCI artifact; pin the chart version and the image digest per environment, so main affects dev only and prod changes only through the promotion PR.
  - Size prod to scale to 3 worker nodes (max).
acceptance:
  - One Argo CD UI/API shows dev, prod, and future environments.
  - Cluster names contain no application name (for example platform-dev / platform-prod).
  - The ECR repository is owned by the platform, not an environment root.
  - An ApplicationSet manifest in the app repository generates the per-environment Applications.
  - The application references only the published contract (SSM), never platform internals.
  - Applications resolve the contract at render time (a CMP plugin), not through Terraform-injected Application values (ADR-015).
  - A commit to main changes dev only; prod changes only through a reviewed promotion pull request (ADR-014).
  - Branch-per-environment and image version tags are not used (ADR-014).
notes:
  - See ADR-013 for the decision and the open questions.
  - "Argo CD lives in prod (no hub). It must reach each environment's private API: VPC peering now, a hub/Transit Gateway later."
  - "How Argo CD consumes the SSM contract: the platform writes wiring into a ConfigMap Argo CD reads, a render plugin (argocd-vault-plugin) reads SSM at render time, or CI writes per-environment values."
  - "Where the ApplicationSet lives (app repo per the request) and how promotion selects the digest (dev-validated digest into the prod values)."
  - This supersedes the per-cluster Argo CD from GITOPS; that task remains done as the first increment.
  - "Progress (local code, no apply): ADR-016 records the single-Argo CD design; modules/argocd gained optional server.insecure + ingress (default off; port-forward is used today); the app repo has deploy/applicationset.yaml (cluster generator, one Application per environment)."
  - "Remaining cutover (needs an apply): peer prod to dev (private EKS APIs), register dev as a cluster labeled platform/environment=dev (and label the local cluster prod), create the app-of-apps Application for deploy/, remove the per-environment Applications and the dev Argo CD, then add the render-time CMP plugin (ADR-015)."
