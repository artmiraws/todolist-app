name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# release-please reads Conventional Commits and opens/updates a release PR; merging it tags a
# version and creates a GitHub Release with a generated changelog. No version file is edited by hand.
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Promote the released, dev-validated digest to prod. Chained here because a release created with
  # GITHUB_TOKEN cannot trigger a separate `on: release` workflow.
  promote:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/promote-prod.yml
    secrets: inherit
